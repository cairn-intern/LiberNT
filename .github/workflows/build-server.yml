name: Build Server edition
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-server:
    runs-on: ubuntu-24.04
    steps:
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium
        sudo docker system prune --all --force
        df -h /

    - name: Source checkout
      uses: actions/checkout@v6

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar python3-mako python3-yaml python3-packaging glslang-tools msitools

    - name: Compute RosBE bootstrap SHA
      id: rosbe_spec
      run: |
        curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
        echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Cache RosBE
      id: cache_rosbe
      uses: actions/cache@v5
      with:
        path: ~/.local/opt/rosbe
        key: rosbe-${{runner.os}}-${{steps.rosbe_spec.outputs.sha}}

    - name: Install RosBE
      if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
      run: sh /tmp/rosbe-bootstrap.sh

    - name: Restore ccache
      id: ccache_restore
      uses: actions/cache/restore@v5
      with:
        path: ccache
        key: ccache-clang-amd64-server-${{github.run_id}}-${{github.run_attempt}}
        restore-keys: |
          ccache-clang-amd64-server-

    - name: Set ccache settings
      run: |
        echo "CCACHE_BASEDIR=${{github.workspace}}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{github.workspace}}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV

    - name: Configure
      id: configure
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ./configure.sh --clang -a amd64 \
          -DROSCONFIG_PROFILE=server \
          -DREACTOS_TARGET_NT=0xA00 \
          -DDIAGDATA_CHANNEL= \
          -DENABLE_CCACHE=1 \
          -DENABLE_MESA_LLVMPIPE=ON
        echo "outdir=output-Clang-amd64-debug" >> "$GITHUB_OUTPUT"

    - name: Build submodules
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} submodules

    - name: Build Server images
      run: |
        . "$HOME/.local/opt/rosbe/rosbe-env.sh"
        ninja -C ${{steps.configure.outputs.outdir}} liberntimg liberntvhd -k0

    - name: Print ccache statistics
      if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
      run: ccache -s

    - name: Save ccache
      id: ccache_save
      if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
      uses: actions/cache/save@v5
      with:
        path: ccache
        key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

    - name: Name artifacts
      id: images
      run: |
        echo "tag=clang-amd64-${GITHUB_SHA::11}" >> "$GITHUB_OUTPUT"
        mv ${{steps.configure.outputs.outdir}}/LiberNT.img ${{steps.configure.outputs.outdir}}/LiberNT-Server.img
        mv ${{steps.configure.outputs.outdir}}/LiberNT.vhd ${{steps.configure.outputs.outdir}}/LiberNT-Server.vhd

    - name: Upload LiberNT-Server.img
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-Server-img-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT-Server.img

    - name: Upload LiberNT-Server.vhd
      uses: actions/upload-artifact@v7
      with:
        name: LiberNT-Server-vhd-${{steps.images.outputs.tag}}
        path: ${{steps.configure.outputs.outdir}}/LiberNT-Server.vhd
